<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="robots" content="noindex, nofollow">
<title>SESMT Grantel</title>
<link rel="manifest" href="manifest.json">
<script>
  /* Aplica o tema antes de desenhar a tela (evita piscar) */
  (function () {
    try {
      var t = localStorage.getItem('sesmt_tema') || 'auto';
      var esc = t === 'escuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-tema', esc ? 'escuro' : 'claro');
    } catch (e) { }
  })();
</script>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
  /* ============================================================
     TEMA DO APP — para mudar o visual, altere só este bloco
     --navy: cor principal (cabeçalho, botões) · --fundo: cor de fundo
     --ok / --aviso / --erro: cores das etiquetas de situação
     ============================================================ */
  :root{
    --navy:#1F3864; --navy-escuro:#142546; --alerta:#F5A623; --cab:#1F3864; --link:#1F3864;
    --fundo:#EEF1F5; --fundo2:var(--fundo2); --card:#FFFFFF; --campo:#FFFFFF; --texto:#18202E; --suave:#4A5568;
    --linha:#E1E6EE; --borda:#B7C0CE;
    --ok-bg:#DCEFE3; --ok:#145C32; --aviso-bg:#FFF1E3; --aviso:#8A3D00;
    --erro-bg:#FBE2E2; --erro:#8E1B1B; --cinza-bg:#E3E7EE; --cinza:#39424F;
    --toast-bg:#18202E; --toast-fg:#FFFFFF; --veu:rgba(238,241,245,.7);
  }
  /* TEMA ESCURO */
  html[data-tema="escuro"]{
    color-scheme:dark;
    --navy:#3D6FD6; --cab:#14213D; --link:#8AB4F8;
    --fundo:#0F1520; --fundo2:#1F2836; --card:#1A2230; --campo:#141B27; --texto:#E6EAF0; --suave:#A3ADBD;
    --linha:#2A3446; --borda:#3A465B;
    --ok-bg:#183A28; --ok:#7FD8A3; --aviso-bg:#3D2A12; --aviso:#F3B26B;
    --erro-bg:#3D1717; --erro:#F28B82; --cinza-bg:#2A3240; --cinza:#C3CAD5;
    --toast-bg:#E6EAF0; --toast-fg:#0F1520; --veu:rgba(15,21,32,.7);
  }
  textarea{background:var(--campo);color:var(--texto)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fundo);color:var(--texto);
    font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}
  body{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  a{color:var(--link);font-weight:600}
  header{background:var(--cab);color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 70px 24px 20px}
  header .marca{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.08em}
  header h1{margin:10px 0 2px;font-size:24px;font-weight:600}
  header p{margin:0;font-size:14px;color:#D3DCEB}
  main{position:relative;z-index:1;max-width:720px;margin:16px auto 0;padding:0 14px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(24,32,46,.08)}
  .lista{background:var(--card);border-radius:14px;box-shadow:0 2px 8px rgba(24,32,46,.08);overflow:hidden}
  .item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--linha)}
  .item:last-child{border-bottom:none}
  .item .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .item .t{font-weight:600}
  .sub{font-size:13px;color:var(--suave)}
  .rotulo{font-size:12px;font-weight:600;color:var(--suave);letter-spacing:.06em}
  .grande{font-family:'IBM Plex Sans Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--link)}
  h2{margin:4px 4px 0;font-size:17px;font-weight:600}
  .linha{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  button,.botao{font-family:inherit;font-size:15px;font-weight:600;min-height:46px;border-radius:10px;
    border:1.5px solid var(--navy);background:var(--navy);color:#fff;padding:0 14px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  button.sec,.botao.sec{background:var(--card);color:var(--link);border-color:var(--link)}
  button.peq{min-height:38px;font-size:13px;padding:0 12px}
  button:disabled{opacity:.55;cursor:wait}
  .chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;white-space:nowrap}
  .chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.aviso{background:var(--aviso-bg);color:var(--aviso)}
  .chip.erro{background:var(--erro-bg);color:var(--erro)} .chip.cinza{background:var(--cinza-bg);color:var(--cinza)}
  .dias{width:48px;height:48px;border-radius:10px;background:var(--aviso-bg);color:var(--aviso);
    display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
  .dias b{font-size:17px;line-height:1} .dias span{font-size:10px;font-weight:600}
  .dias.vencido{background:var(--erro-bg);color:var(--erro)}
  input,select{font-family:inherit;font-size:16px;min-height:46px;border-radius:10px;border:1.5px solid var(--borda);
    padding:0 12px;width:100%;color:var(--texto);background:var(--campo)}
  label{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
  .campo{display:flex;flex-direction:column;gap:6px}
  .acao{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;
    text-decoration:none;color:var(--texto);box-shadow:0 2px 8px rgba(24,32,46,.08);border:none;text-align:left;min-height:auto;font-weight:400}
  .acao b{font-size:15px}
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--linha);
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
  nav button{background:var(--card);border:none;color:var(--suave);border-radius:0;flex-direction:column;gap:3px;
    font-size:12px;font-weight:500;min-height:64px}
  nav button.ativo{color:var(--link);font-weight:700}
  .secao{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--linha);border-radius:12px}
  .secao .n{width:52px;height:52px;border-radius:10px;background:var(--cinza-bg);display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:18px;color:var(--cinza);flex-shrink:0}
  .secao .n.tem{background:var(--ok-bg);color:var(--ok)}
  .escondido{display:none!important}
  #toast{position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;
    background:var(--toast-bg);color:var(--toast-fg);border-radius:12px;padding:14px 16px;white-space:pre-line;z-index:10;
    box-shadow:0 6px 18px rgba(0,0,0,.25)}
  #carregando{position:fixed;inset:0;background:var(--veu);display:flex;align-items:center;justify-content:center;z-index:9}
  .giro{width:42px;height:42px;border:4px solid var(--linha);border-top-color:var(--navy);border-radius:50%;animation:g 1s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .vazio{padding:18px 16px;color:var(--suave)}
  svg{flex-shrink:0}
  #folha{position:fixed;inset:0;background:rgba(24,32,46,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  #folha .caixa{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;gap:10px;box-shadow:0 -6px 24px rgba(0,0,0,.2)}
  .abas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--cinza-bg);padding:4px;border-radius:12px}
  .abas button{background:transparent;border:none;color:var(--suave);min-height:40px;font-size:14px}
  .abas button.on{background:var(--card);color:var(--link);box-shadow:0 1px 3px rgba(24,32,46,.12)}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .cal .sem{font-size:11px;font-weight:700;color:var(--suave);text-align:center;padding:4px 0}
  .cal button{min-height:48px;padding:4px 0;border-radius:10px;background:var(--card);border:1px solid var(--linha);color:var(--texto);
    flex-direction:column;gap:3px;font-size:14px;font-weight:600}
  .cal button.hoje{border:2px solid var(--link)}
  .cal button.sel{background:var(--navy);color:#fff}
  .pontos{display:flex;gap:3px;height:6px}
  .pontos i{width:6px;height:6px;border-radius:3px;display:block}
  .barras{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:24px}
  .barras .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
  .barras .bar{width:100%;max-width:46px;border-radius:8px 8px 0 0;background:var(--navy);position:relative}
  .barras .bar span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--texto)}
header.com-voltar{padding-left:70px}
</style>
</head>
<body>

<header style="position:relative">
  <button onclick="ir('config')" aria-label="Configurações" style="position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));width:44px;height:44px;min-height:44px;padding:0;border-radius:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <button id="bvoltar" class="escondido" onclick="voltar()" aria-label="Voltar" style="position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top,0px));width:44px;height:44px;min-height:44px;padding:0;border-radius:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<div class="marca">SESMT · GRANTEL</div>
  <h1 id="h-titulo">Carregando…</h1>
  <p id="h-sub"></p>
</header>

<main id="tela"></main>

<nav aria-label="Navegação principal">
  <button data-aba="inicio" class="ativo" onclick="irAba('inicio')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Início</button>
  <button data-aba="agenda" onclick="irAba('agenda')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Agenda</button>
  <button data-aba="dds" onclick="irAba('dds')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>DDS</button>
  <button data-aba="veiculos" onclick="irAba('veiculos')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14v-5l-2-5H7l-2 5z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>Veículos</button>
  <button data-aba="equipe" onclick="irAba('equipe')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Equipe</button>
</nav>

<div id="carregando" class="escondido"><div class="giro" role="status" aria-label="Carregando"></div></div>
<div id="toast" class="escondido" role="status"></div>
<input type="file" id="arquivo" accept="image/*" multiple class="escondido">

<script>
/* ---------- ponte com o Google ---------- */
/* Endereço do servidor de dados (Apps Script). Não contém dados, só recebe pedidos com login. */
const API_URL = 'https://script.google.com/macros/s/AKfycby8sd77tSajJuINQpJMGJXFbopy0fUd6L1xZK9FRPwwXEOE6jXU-O3rdjjr67EwSDz3/exec';

function token() { try { return localStorage.getItem('sesmt_token') || ''; } catch (e) { return ''; } }
async function chamar(corpo, tentativa) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) });
  const txt = await r.text();
  try { return JSON.parse(txt); }
  catch (e) {
    if (!tentativa) return chamar(corpo, 1);   // o Google às vezes devolve uma página de erro passageira
    const resumo = txt.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140);
    throw new Error('Resposta inesperada do servidor (código ' + r.status + '). ' + (resumo || 'Resposta vazia.'));
  }
}
function run(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return chamar({ token: token(), fn: fn, args: args }).then(function (res) {
    if (res.ok) return res.r;
    if (res.erro === 'SESSAO') { telaLogin(); throw new Error('Sua sessão terminou. Entre de novo.'); }
    throw new Error(res.erro || 'Erro no servidor');
  });
}

/* ---------- LOGIN ---------- */
function telaLogin(msg) {
  TOK++;
  try { localStorage.removeItem('sesmt_token'); } catch (e) { }
  document.querySelector('nav').classList.add('escondido');
PILHA.length = 0; atualizarVoltar();
  cabec('Entrar', 'SESMT Grantel');
  carregando(false);
  tela('<section class="card" style="display:flex;flex-direction:column;gap:12px;max-width:420px;width:100%;align-self:center">' +
    '<div class="campo"><label for="lu">Usuário</label><input id="lu" autocomplete="username" autocapitalize="none"></div>' +
    '<div class="campo"><label for="ls">Senha</label><input id="ls" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')entrar(this)"></div>' +
    '<button onclick="entrar(this)">Entrar</button>' +
    (msg ? '<span class="sub" style="color:var(--erro)">' + esc(msg) + '</span>' : '') + '</section>');
}

async function entrar(btn) {
  btn.disabled = true; carregando(true);
  try {
    const r = await chamar({ acao: 'login', usuario: $('lu').value, senha: $('ls').value });
    if (!r.ok) { carregando(false); telaLogin(r.erro); return; }
    localStorage.setItem('sesmt_token', r.token);
    document.querySelector('nav').classList.remove('escondido');
    ir('inicio');
    setTimeout(preCarregar, 2500);
  } catch (e) { carregando(false); telaLogin(e.message); }
}

async function sair() {
  if (!confirm('Sair do app neste aparelho?')) return;
  try { await chamar({ acao: 'sair', token: token() }); } catch (e) { }
  try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('sesmt') === 0) localStorage.removeItem(k); }); } catch (e) { }
  telaLogin();
}
const E = {};  // estado
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(n) { return n == null || n === '' ? '—' : Number(n).toLocaleString('pt-BR'); }
function $(id) { return document.getElementById(id); }
function carregando(on) { $('carregando').classList.toggle('escondido', !on); }
let toastT;
function aviso(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('escondido');
  clearTimeout(toastT); toastT = setTimeout(function () { t.classList.add('escondido'); }, ms || 5000);
}
function falha(e) { carregando(false); aviso('⚠ ' + (e && e.message ? e.message : e), 8000); }
function tela(html) { $('tela').innerHTML = html; window.scrollTo(0, 0); }
function cabec(t, s) { $('h-titulo').textContent = t; $('h-sub').textContent = s || ''; }

/* ---------- MÊS DOS DOCUMENTOS (um só para o app todo, escolhido na tela inicial) ---------- */
const NOMES_MES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
function mesAtualISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function mesRef() {
  try {
    const g = JSON.parse(localStorage.getItem('sesmt_mes') || 'null');
    if (g && g.m && g.em === mesAtualISO()) return g.m; // quando vira o mês, volta sozinho para o mês atual
  } catch (e) { }
  return mesAtualISO();
}
function nomeMesRef(m) { const p = String(m || mesRef()).split('-'); return NOMES_MES[Number(p[1]) - 1] + '/' + p[0]; }
function definirMesRef(m, depois) {
  try {
    if (m === mesAtualISO()) localStorage.removeItem('sesmt_mes');
    else localStorage.setItem('sesmt_mes', JSON.stringify({ m: m, em: mesAtualISO() }));
  } catch (e) { }
  E.chk = null; E.ag = null;
  (depois || verInicio)();
  aviso('Mês dos documentos: ' + nomeMesRef(m), 2500);
  setTimeout(function () { preCarregar(true); }, 800);
}
function mudarMesRef(delta, depois) {
  const p = mesRef().split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
  definirMesRef(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), depois);
}
function cartaoMes() {
  const m = mesRef(), atual = m === mesAtualISO();
  const seta = function (d, rot, t) { return '<button class="sec" aria-label="' + rot + '" onclick="mudarMesRef(' + d + ')" style="width:46px;padding:0;font-size:22px">' + t + '</button>'; };
  return '<section class="card" style="display:flex;flex-direction:column;gap:10px"><span class="rotulo">MÊS DOS DOCUMENTOS</span>' +
    '<div style="display:flex;align-items:center;gap:10px">' + seta(-1, 'Mês anterior', '‹') +
    '<b style="flex:1;text-align:center;font-size:20px">' + esc(nomeMesRef(m)) + '</b>' + seta(1, 'Próximo mês', '›') + '</div>' +
    (atual ? '<span class="sub">Mês atual. Vale para veículos, alojamentos, checklist e agenda.</span>'
      : '<span class="chip aviso" style="align-self:flex-start">Fora do mês atual</span>' +
        '<button class="sec peq" onclick="definirMesRef(mesAtualISO())">Voltar para ' + esc(nomeMesRef(mesAtualISO())) + '</button>') +
    '</section>';
}
function etiquetaMes() {
  const m = mesRef(), atual = m === mesAtualISO();
  return '<div class="linha" style="align-items:center"><span class="sub">Mês dos documentos: <b style="color:var(--texto)">' + esc(nomeMesRef(m)) + '</b> · troque na tela inicial</span>' +
    (atual ? '' : '<span class="chip aviso">Fora do mês atual</span>') + '</div>';
}

/* ---------- BOTÃO VOLTAR (seta no cabeçalho e voltar do celular) ---------- */
const PILHA = []; // telas abertas, da primeira à atual
const ABA_DA_TELA = { inicio: 'inicio', agenda: 'agenda', dds: 'dds', veiculos: 'veiculos', veiculo: 'veiculos', equipe: 'equipe' };
function marcar(chave, fn, formulario) {
  const i = PILHA.findIndex(function (p) { return p.chave === chave; });
  if (i >= 0) { PILHA.length = i + 1; PILHA[i].fn = fn; }
  else {
    const topo = PILHA[PILHA.length - 1];
    if (topo && topo.formulario) PILHA.pop(); // depois de salvar um cadastro, o voltar não reabre o formulário
    PILHA.push({ chave: chave, fn: fn, formulario: !!formulario });
  }
  const aba = ABA_DA_TELA[chave] || '';
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('ativo', b.dataset.aba === aba); });
  atualizarVoltar();
}
function atualizarVoltar() {
  const tem = PILHA.length > 1;
  $('bvoltar').classList.toggle('escondido', !tem);
  document.querySelector('header').classList.toggle('com-voltar', tem);
}
function voltar() {
  fecharFolha();
  if (PILHA.length > 1) { PILHA.pop(); PILHA[PILHA.length - 1].fn(); }
  else if (!PILHA.length || PILHA[0].chave !== 'inicio') irAba('inicio');
}
function irAba(aba) {
  PILHA.length = 0;
  if (aba !== 'inicio') PILHA.push({ chave: 'inicio', fn: verInicio });
  ir(aba);
}
function armarVoltar() { try { if (!history.state || history.state.sesmt !== 'topo') history.pushState({ sesmt: 'topo' }, ''); } catch (e) { } }
window.addEventListener('popstate', function () {
  if ($('folha')) { fecharFolha(); armarVoltar(); return; }
  if (PILHA.length > 1) { voltar(); armarVoltar(); return; }
  aviso('Toque em voltar de novo para sair do app.', 2500);
});

/* Mostra na hora o que já foi carregado antes e atualiza por trás */
let TOK = 0;
async function carregarTela(fn, args, render) {
  const tok = ++TOK;
  const k = 'sesmt:' + fn + ':' + JSON.stringify(args || []);
  let cache = null;
  try { cache = localStorage.getItem(k); } catch (e) { cache = null; }
  if (cache) { try { render(JSON.parse(cache)); } catch (e) { cache = null; } }
  if (!cache) carregando(true);
  try {
    const novo = await run.apply(null, [fn].concat(args || []));
    const s = JSON.stringify(novo);
    try { localStorage.setItem(k, s); } catch (e) { }
    if (tok === TOK && s !== cache) render(novo);
  } catch (e) { if (tok === TOK) falha(e); }
  if (tok === TOK) carregando(false);
}

/* ---------- TEMA CLARO / ESCURO ---------- */
function temaEscolhido() { try { return localStorage.getItem('sesmt_tema') || 'auto'; } catch (e) { return 'auto'; } }
function nomeTema(t) { return { auto: 'Automático (segue o celular)', claro: 'Claro', escuro: 'Escuro' }[t || temaEscolhido()]; }
function aplicarTema() {
  const t = temaEscolhido();
  const esc = t === 'escuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-tema', esc ? 'escuro' : 'claro');
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', esc ? '#14213D' : '#1F3864');
}
if (window.matchMedia) {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', function () { if (temaEscolhido() === 'auto') aplicarTema(); });
}
function escolherTema() {
  fecharFolha();
  const f = document.createElement('div');
  f.id = 'folha';
  f.onclick = function (e) { if (e.target === f) fecharFolha(); };
  const atual = temaEscolhido();
  f.innerHTML = '<div class="caixa" role="dialog" aria-label="Tema do app"><b style="font-size:16px">Tema do app</b>' +
    ['auto', 'claro', 'escuro'].map(function (t) {
      return '<button class="' + (t === atual ? '' : 'sec') + '" onclick="definirTema(\'' + t + '\')">' + (t === atual ? '✓ ' : '') + nomeTema(t) + '</button>';
    }).join('') + '<button class="sec" onclick="fecharFolha()">Fechar</button></div>';
  document.body.appendChild(f);
}
function definirTema(t) {
  try { localStorage.setItem('sesmt_tema', t); } catch (e) { }
  aplicarTema(); fecharFolha();
  if (document.getElementById('h-titulo').textContent === 'Configurações') verConfig();
  aviso('✔ Tema: ' + nomeTema(t));
}

/* ---------- DOCUMENTOS: compartilhar, baixar, enviar por e-mail ---------- */
const DOCS = [];
const PDFS = {};
function regDoc(url, nome) { DOCS.push({ url: url, nome: nome || 'documento' }); return DOCS.length - 1; }

function fecharFolha() { const f = $('folha'); if (f) f.remove(); }

async function abrirDoc(i) {
  const d = DOCS[i];
  fecharFolha();
  const f = document.createElement('div');
  f.id = 'folha';
  f.onclick = function (e) { if (e.target === f) fecharFolha(); };
  f.innerHTML = '<div class="caixa" role="dialog" aria-label="Documento">' +
    '<b style="font-size:16px">' + esc(d.nome) + '</b>' +
    '<span class="sub" id="fstatus">Preparando o arquivo…</span>' +
    '<button id="fcomp" disabled onclick="compartilharDoc(' + i + ')">Compartilhar (WhatsApp, e-mail…)</button>' +
    '<button id="fbaixar" class="sec" disabled onclick="baixarDoc(' + i + ')">Baixar / Imprimir</button>' +
    (/^(form|caso|cepi):/.test(String(d.url)) ? '' : '<button class="sec" onclick="emailDoc(' + i + ', this)">Enviar por e-mail (cadastrados no ⚙)</button>') +
    '<button class="sec" onclick="fecharFolha()">Fechar</button></div>';
  document.body.appendChild(f);
  try {
    if (!PDFS[d.url]) {
      const ehForm = String(d.url).indexOf('form:') === 0;
      let r = null;
      try { r = d.url === 'caso:' ? await run('apiControleASO') : d.url === 'cepi:' ? await run('apiControleEPI') : ehForm ? await run('apiFormularioPdf', d.url.slice(5)) : await run('apiPdfDocumento', d.url); }
      catch (e) {
        const g = ehForm ? await formLer(d.url.slice(5)) : null;   // sem internet: cópia guardada no celular
        if (!g) throw e;
        PDFS[d.url] = g.file; d.offline = g.quando;
      }
      if (r) {
        const bin = atob(r.base64), bytes = new Uint8Array(bin.length);
        for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
        PDFS[d.url] = new File([bytes], r.nome, { type: r.mime || 'application/pdf' });
        if (ehForm) formGuardar(d.url.slice(5), PDFS[d.url]);
      }
    }
    if (!$('folha')) return;
    $('fstatus').textContent = (d.offline ? 'Sem internet: cópia de ' + d.offline + ' · ' : (/^(caso|cepi):$/.test(d.url) ? 'Planilha pronta: ' + PDFS[d.url].name + ' · ' : 'PDF pronto · ')) + Math.max(1, Math.round(PDFS[d.url].size / 1024)) + ' KB';
    $('fcomp').disabled = false; $('fbaixar').disabled = false;
  } catch (e) {
    if ($('fstatus')) $('fstatus').textContent = '⚠ ' + (e.message || e);
  }
}

async function compartilharDoc(i) {
  const file = PDFS[DOCS[i].url];
  if (!file) return;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: file.name }); }
    catch (e) { if (e.name !== 'AbortError') aviso('⚠ Não foi possível compartilhar: ' + e.message); }
  } else {
    aviso('Este navegador não compartilha arquivos. Use "Baixar" e envie pelo WhatsApp.', 7000);
    baixarDoc(i);
  }
}

function baixarDoc(i) {
  const file = PDFS[DOCS[i].url];
  if (!file) return;
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  aviso('✔ PDF salvo em Downloads. Abra para imprimir ou enviar.', 6000);
}

async function emailDoc(i, btn) {
  btn.disabled = true;
  try { aviso(await run('apiEnviarEmailDocumento', DOCS[i].url), 7000); }
  catch (e) { falha(e); }
  btn.disabled = false;
}

/* Esquece telas guardadas que mudaram depois de uma gravação */
function esquecer(prefixos) {
  try { Object.keys(localStorage).forEach(function (k) { if (prefixos.some(function (p) { return k.indexOf('sesmt:' + p) === 0; })) localStorage.removeItem(k); }); } catch (e) { }
}

/* Busca por trás os dados das outras telas, para elas abrirem na hora */
async function preCarregar(soMes) {
const M = mesRef();
  const lista = [['apiChecklistMes', [M]], ['apiAgenda', [M]], ['apiVeiculos', [M]], ['apiAlojamentos', [M]]].concat(soMes ? [] : [['apiColaboradores', []],
                 ['apiFadigaOpcoes', []], ['apiDesempenho', []]]);
  for (let i = 0; i < lista.length; i++) {
    if (!token()) return;
    try {
      const r = await run.apply(null, [lista[i][0]].concat(lista[i][1]));
      localStorage.setItem('sesmt:' + lista[i][0] + ':' + JSON.stringify(lista[i][1]), JSON.stringify(r));
    } catch (e) { }
  }
}

/* Executa várias tarefas ao mesmo tempo (ex.: enviar 3 fotos juntas) */
async function emParalelo(itens, n, fn) {
  let prox = 0, feitos = 0;
  async function trabalhador() {
    while (prox < itens.length) {
      const i = prox++;
      await fn(itens[i], i);
      feitos++;
      aviso('Enviando fotos: ' + feitos + ' de ' + itens.length + '…', 60000);
    }
  }
  const ws = [];
  for (let k = 0; k < Math.min(n, itens.length); k++) ws.push(trabalhador());
  await Promise.all(ws);
}

async function limparTudo() {
  try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('sesmt:') === 0) localStorage.removeItem(k); }); } catch (e) { }
  carregando(true);
  try { aviso(await run('apiLimparCache')); } catch (e) { falha(e); }
  carregando(false);
}

/* ---------- TEMAS DO DDS (até 4, um por linha do quadro 2) ---------- */
const MAX_TEMAS = 4;
let TEMAS = null;   // [{ fazer, riscos, evitar, compromissos }] em edição
function semAcento(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
async function carregarTemas() {
  if (E.temas) return;
  try {
    const r = await run('apiTemasDDS');
    E.temas = r.temas || [];
    const vazio = !(TEMAS || []).some(function (x) { return String(x.fazer || '').trim(); });
    if (vazio && r.ultimo) TEMAS = Array.isArray(r.ultimo) ? r.ultimo : [r.ultimo];
    redesenharTemas();
  } catch (e) { }
}
function redesenharTemas() { const c = document.getElementById('cartaoTema'); if (c) c.outerHTML = cartaoTema(); }
function cartaoTema() {
  if (!TEMAS || !TEMAS.length) TEMAS = [{}];
  const estilo = 'font:inherit;font-size:15px;line-height:1.4;padding:10px 12px;border:1px solid var(--linha);border-radius:12px;resize:vertical;width:100%;box-sizing:border-box';
  let h = '<section class="card" id="cartaoTema" style="display:flex;flex-direction:column;gap:8px"><span class="rotulo">TEMAS DO DDS · ATÉ ' + MAX_TEMAS + '</span>' +
    '<span class="sub">Valem para o próximo DDS. Se ele já foi gerado (ex.: às 17h), os temas são colocados nele e o PDF é refeito.' +
    (E.temas ? '' : ' Carregando temas…') + '</span>' +
    '<datalist id="listaTemas">' + (E.temas || []).map(function (x) { return '<option value="' + esc(x.fazer) + '">'; }).join('') + '</datalist>';
  TEMAS.forEach(function (t, i) {
    const campo = function (chave, rotulo) {
      return '<label class="sub" for="t' + i + '_' + chave + '"><b>' + rotulo + '</b></label>' +
        '<textarea id="t' + i + '_' + chave + '" rows="3" style="' + estilo + '" oninput="temaCampo(' + i + ', \'' + chave + '\', this.value)">' + esc(t[chave] || '') + '</textarea>';
    };
    h += '<div style="border:1px solid var(--linha);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><b>Tema ' + (i + 1) + '</b>' +
      (TEMAS.length > 1 ? '<button class="sec peq" onclick="removerTema(' + i + ')">Remover</button>' : '') + '</div>' +
      '<label class="sub" for="t' + i + '_fazer"><b>2.1 O que vamos fazer?</b></label>' +
      '<input id="t' + i + '_fazer" list="listaTemas" autocomplete="off" placeholder="Escreva ou escolha a atividade" value="' + esc(t.fazer || '') + '" oninput="temaFazer(' + i + ', this.value, false)" onchange="temaFazer(' + i + ', this.value, true)">' +
      '<span id="t' + i + '_aviso" class="sub"></span>' +
      campo('riscos', '2.2 Onde podemos nos machucar nesse trabalho') +
      campo('evitar', '2.3 Como podemos evitar o machucado') +
      campo('compromissos', '2.4 Quais são os nossos compromissos?') + '</div>';
  });
  if (TEMAS.length < MAX_TEMAS) h += '<button class="sec" onclick="adicionarTema()">+ Adicionar tema (' + TEMAS.length + ' de ' + MAX_TEMAS + ')</button>';
  return h + '<button class="sec" onclick="salvarTema(this)">Salvar temas para o DDS automático</button></section>';
}
function adicionarTema() { if (TEMAS.length < MAX_TEMAS) { TEMAS.push({}); redesenharTemas(); const el = document.getElementById('t' + (TEMAS.length - 1) + '_fazer'); if (el) el.focus(); } }
function removerTema(i) { TEMAS.splice(i, 1); redesenharTemas(); }
function temaCampo(i, chave, valor) { TEMAS[i] = TEMAS[i] || {}; TEMAS[i][chave] = valor; }
function temaFazer(i, v, fim) {
  const T = TEMAS[i] = TEMAS[i] || {};
  T.fazer = v;
  const lista = E.temas || [], alvo = semAcento(v).trim();
  let achou = lista.filter(function (x) { return semAcento(x.fazer).trim() === alvo; })[0], msg = '';
  if (!achou && fim && alvo) {
    const pal = alvo.split(/[^a-z0-9]+/).filter(function (p) { return p.length > 3; });
    let melhor = null, pts = 0;
    lista.forEach(function (x) {
      const txt = semAcento(x.fazer + ' ' + x.riscos);
      let p = 0;
      pal.forEach(function (w) { if (txt.indexOf(w.slice(0, Math.max(4, w.length - 2))) >= 0) p++; });
      if (p > pts) { pts = p; melhor = x; }
    });
    if (melhor) { achou = melhor; msg = 'Preenchido pelo tema parecido "' + melhor.fazer + '". Confira e ajuste se precisar.'; }
    else msg = 'Atividade nova: preencha os itens abaixo. Ela fica salva no banco para as próximas vezes.';
  }
  if (achou) {
    ['riscos', 'evitar', 'compromissos'].forEach(function (k) {
      T[k] = achou[k];
      const el = document.getElementById('t' + i + '_' + k); if (el) el.value = achou[k];
    });
    if (!msg) msg = '✔ Tema do banco preenchido.';
  }
  const a = document.getElementById('t' + i + '_aviso');
  if (a && msg) a.textContent = msg;
}
// null = nenhum tema escrito (o servidor repete os últimos); false = tema incompleto
function temaParaEnviar() {
  const lista = (TEMAS || []).filter(function (t) { return String(t.fazer || '').trim(); });
  if (!lista.length) return null;
  for (let i = 0; i < lista.length; i++) {
    const t = lista[i];
    if (!String(t.riscos || '').trim() || !String(t.evitar || '').trim() || !String(t.compromissos || '').trim()) {
      aviso('Complete os itens 2.2, 2.3 e 2.4 do tema "' + t.fazer + '".'); return false;
    }
  }
  return lista.map(function (t) { return { fazer: t.fazer.trim(), riscos: t.riscos.trim(), evitar: t.evitar.trim(), compromissos: t.compromissos.trim() }; });
}
function temaGuardado(lista) {
  (lista || []).forEach(function (t) {
    if (E.temas && !E.temas.some(function (x) { return semAcento(x.fazer) === semAcento(t.fazer); })) E.temas.push(t);
  });
  esquecer(['apiListaDDS', 'apiPainel']);
}
async function salvarTema(btn) {
  const t = temaParaEnviar();
  if (t === null) return aviso('Escreva primeiro o item 2.1 "O que vamos fazer?".');
  if (!t) return;
  btn.disabled = true; carregando(true);
  try { aviso(await run('apiSalvarTemaDDS', t), 8000); temaGuardado(t); } catch (e) { falha(e); }
  carregando(false); btn.disabled = false;
}
async function trocarTemaDDS(i, btn) {
  const d = (E.ddsLista || [])[i], t = temaParaEnviar();
  if (!d) return;
  if (t === null) return aviso('Escreva os temas no quadro acima e toque de novo em "Usar temas".');
  if (!t) return;
  if (!confirm('Colocar no DDS de ' + d.data + ' os temas:\n' + t.map(function (x, k) { return (k + 1) + '. ' + x.fazer; }).join('\n') + '\n\nO PDF será refeito com o mesmo número.')) return;
  btn.disabled = true; carregando(true);
  try { aviso(await run('apiAplicarTemaDDS', d.codigo, t), 8000); temaGuardado(t); carregando(false); verDDS(); }
  catch (e) { falha(e); btn.disabled = false; }
}

async function gerarDDS(btn) {
  const t = temaParaEnviar(); if (t === false) return;
  btn.disabled = true; carregando(true);
  try { aviso(await run('apiGerarDDS', t)); temaGuardado(t); verInicio(); } catch (e) { falha(e); btn.disabled = false; }
}
async function gerarSemana(btn) {
  const t = temaParaEnviar(); if (t === false) return;
  btn.disabled = true; carregando(true);
  try { aviso(await run('apiGerarSemanaDDS', t), 9000); temaGuardado(t); verInicio(); } catch (e) { falha(e); btn.disabled = false; }
}

/* ---------- DDS ---------- */
function verDDS() {
  marcar('dds', verDDS);
  cabec('DDS', 'Diálogo Diário de Segurança');
  carregarTemas();

/* Reduz a foto no próprio celular antes de enviar (bem mais leve e rápido) */
async function reduzir(file, max, qualidade) {
  max = Math.min(max || 1100, 1100); qualidade = qualidade || 0.75;
  let fonte, w, h, url = null;
  try {
    fonte = await createImageBitmap(file, { imageOrientation: 'from-image' });
    w = fonte.width; h = fonte.height;
  } catch (e) {
    fonte = await new Promise(function (res, rej) {
      const img = new Image(); url = URL.createObjectURL(file);
      img.onload = function () { res(img); };
      img.onerror = function () { rej(new Error('Não consegui ler a imagem ' + file.name)); };
      img.src = url;
    });
    w = fonte.naturalWidth || fonte.width; h = fonte.naturalHeight || fonte.height;
  }
  const desenhar = function (lado, q) {
    const s = Math.min(1, lado / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(fonte, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  };
  const foto = desenhar(max, qualidade), mini = desenhar(320, 0.6);
  if (fonte.close) fonte.close();
  if (url) URL.revokeObjectURL(url);
  return { foto: foto, mini: mini };
}

/* Divide uma lista em pacotes (ex.: 3 fotos por envio) */
function emPacotes(lista, n) {
  const out = [];
  for (let i = 0; i < lista.length; i += n) out.push(lista.slice(i, i + n));
  return out;
}


async function enviarFotos(files) {
  if (!files.length) return;
  const v = E.veic.veiculos[E.vi], mes = E.veic.mes, secao = E.secao;
  const dest = 'veic|' + mes + '|' + v.placa + '|' + secao;
  const livre = FOTOS_POR_PARTE - (v.fotos[secao] || 0) - naFila(dest).length;
  if (files.length > livre) return aviso('Esta parte aceita só mais ' + Math.max(0, livre) + ' foto(s) (limite ' + FOTOS_POR_PARTE + ' por parte, contando as da fila). Escolha de novo.', 7000);
  files.sort(function (a, b) { return (a.lastModified || 0) - (b.lastModified || 0); });
  carregando(true);
  try {
    const itens = [], agora = Date.now();
    for (let i = 0; i < files.length; i++) {
      const rr = await reduzir(files[i]);
      itens.push({ chave: novaChave(), tipo: 'veic', mes: mes, placa: v.placa, secao: secao,
        nome: String(files[i].lastModified || agora) + '_' + String(i).padStart(3, '0') + '.jpg', foto: rr.foto, mini: rr.mini, criado: agora + i });
    }
    await guardarNaFila(itens);
    carregando(false);
    aviso(navigator.onLine ? '✔ ' + itens.length + ' foto(s) guardada(s). Enviando…' : '📶 Sem internet: ' + itens.length + ' foto(s) guardada(s) no celular. Serão enviadas quando a internet voltar.', 6000);
    redesenharVeic();
    processarFila();
  } catch (e) { falha(e); }
}

function epiSit(it) {

function epiCaSit(iso) {

function epiCaTag(it) {

  const t = it.caSit === 'vencido' ? ' · vencido' : it.caSit === 'vence' ? ' · vence ' + it.validade : '';

function epiCat(i) { E.epiF.cat = i === -1 ? '' : i === -2 ? 'alertas' : E.epi.cats[i]; desenharEpi(); }
function listaEpi() {

  const vis = d.itens.filter(function (it) {
    if (f.cat === 'alertas') { const s = epiSit(it); if (!(s === 'er' || s === 'av' || it.caSit === 'vencido' || it.caSit === 'vence')) return false; }
    else if (f.cat && it.cat !== f.cat) return false;

function trocarFotoForm(id) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = async function () {
    const file = inp.files && inp.files[0];
    inp.remove();
    if (!file) return;
    carregando(true);
    try {
      const r = await reduzir(file, 1100, 0.8);
      await run('apiFormularioTrocarFoto', id, r.foto);
      delete PDFS['form:' + id];
      formApagar(id);
      aviso('✓ Foto trocada. O próximo PDF já sai com a foto nova.');
    } catch (e) { falha(e); }
    finally { carregando(false); }
  };
  inp.click();
}

// Cópia do último PDF de cada formulário no celular (para abrir sem internet)
function formBanco() {
  return new Promise(function (ok, erro) {
    const q = indexedDB.open('sesmt_forms', 1);
    q.onupgradeneeded = function () { q.result.createObjectStore('pdf', { keyPath: 'id' }); };
    q.onsuccess = function () { ok(q.result); };
    q.onerror = function () { erro(q.error); };
  });
}
async function formGuardar(id, file) {
  try {
    const db = await formBanco();
    db.transaction('pdf', 'readwrite').objectStore('pdf').put({ id: id, nome: file.name, blob: file, quando: new Date().toLocaleDateString('pt-BR') });
  } catch (e) { }
}
async function formLer(id) {
  try {
    const db = await formBanco();
    const x = await new Promise(function (ok) {
      const q = db.transaction('pdf').objectStore('pdf').get(id);
      q.onsuccess = function () { ok(q.result); }; q.onerror = function () { ok(null); };
    });
    return x ? { file: new File([x.blob], x.nome, { type: 'application/pdf' }), quando: x.quando } : null;
  } catch (e) { return null; }
}

    casa.fotos = fotos;
    const y = window.scrollY; guardarRascunhoCasa(); desenharCasa(); window.scrollTo(0, y);

}

function camposCasa(c) {
  c = c || {};
  const campo = function (id, rot, val, tipo) {
    return '<div class="campo"><label for="' + id + '">' + rot + '</label><input id="' + id + '" ' + (tipo === 'n' ? 'inputmode="numeric"' : '') + ' value="' + esc(val == null ? '' : val) + '"></div>';
  };
  const area = function (id, rot, val) {
    return '<div class="campo"><label for="' + id + '">' + rot + '</label><textarea id="' + id + '" rows="3" style="font-family:inherit;font-size:15px;border-radius:10px;border:1.5px solid var(--borda);padding:10px">' + esc(val || '') + '</textarea></div>';
  };
  return campo('cident', 'Identificação (endereço)', c.identificacao) +
    '<div class="grade2">' + campo('ccom', 'Nº de cômodos', c.comodos, 'n') + campo('cqua', 'Nº de quartos', c.quartos, 'n') +
    campo('csan', 'Nº de sanitários', c.sanitarios, 'n') + campo('cchu', 'Nº de chuveiros', c.chuveiros, 'n') +
    campo('caloj', 'Nº de alojados', c.alojados, 'n') + '</div>' +
    area('cdesc', 'Descrição dos cômodos (um por linha)', c.descricao) +
    area('cobsf', 'Observações fixas (saem todo mês)', c.obsFixas);
}

function lerCamposCasa(id, status) {
  return { id: id || '', identificacao: $('cident').value, comodos: $('ccom').value, quartos: $('cqua').value,
           sanitarios: $('csan').value, chuveiros: $('cchu').value, alojados: $('caloj').value,
           descricao: $('cdesc').value, obsFixas: $('cobsf').value, status: status || 'ATIVA' };
}

function alternarNc(i) {
  if (i in E.nc) delete E.nc[i]; else E.nc[i] = '';

}

function guardarRascunhoCasa() {
  const ins = E.casa.inspecao || (E.casa.inspecao = {});
  if ($('adata')) ins.data = $('adata').value;
  if ($('ahora')) ins.horario = $('ahora').value;
  if ($('apontos')) ins.pontos = $('apontos').value;
  if ($('aobs')) ins.obs = $('aobs').value;
}

async function salvarInspecaoCasa(btn) {
  guardarRascunhoCasa();
  const ins = E.casa.inspecao;
  btn.disabled = true; carregando(true);
  try {
    await run('apiAlojSalvarInspecao', E.aloj.mes, E.casa.casa.id, {
      data: ins.data, horario: ins.horario, pontos: ins.pontos, obs: ins.obs,
      nc: Object.keys(E.nc).map(function (k) { return { i: Number(k), obs: E.nc[k] }; })
    });
    aviso('✔ Inspeção salva');
  } catch (e) { falha(e); }
  btn.disabled = false; carregando(false);
}

function escolherFotosCasa() {
  const sel = $('aleg').value;
  const leg = sel === '__OUTRA' ? $('alego').value.trim() : sel;
  if (!leg) { aviso('Escreva a legenda antes de escolher as fotos.'); return; }
  guardarRascunhoCasa();
  const inp = $('arquivo'); inp.value = '';
  inp.onchange = function () { enviarFotosCasa(Array.prototype.slice.call(inp.files), leg); };
  inp.click();
}

async function enviarFotosCasa(files, leg) {
  if (!files.length) return;
  files.sort(function (a, b) { return (a.lastModified || 0) - (b.lastModified || 0); });
  const casa = E.casa, mes = E.aloj.mes, id = casa.casa.id;
  const base = casa.fotos.length + naFila('aloj|' + mes + '|' + id).length;
  carregando(true);
  try {
    const itens = [], agora = Date.now();
    for (let i = 0; i < files.length; i++) {
      const rr = await reduzir(files[i]);
      itens.push({ chave: novaChave(), tipo: 'aloj', mes: mes, casa: id, legenda: leg, ordem: base + i, foto: rr.foto, mini: rr.mini, criado: agora + i });
    }
    await guardarNaFila(itens);
    carregando(false);
    aviso(navigator.onLine ? '✔ ' + itens.length + ' foto(s) guardada(s) como ' + leg + '. Enviando…' : '📶 Sem internet: ' + itens.length + ' foto(s) guardada(s) no celular. Serão enviadas quando a internet voltar.', 6000);
    if (E.casa === casa) { const y = window.scrollY; guardarRascunhoCasa(); desenharCasa(); window.scrollTo(0, y); }
    processarFila();
  } catch (e) { falha(e); }
}


async function trocarLegenda(i) {

async function excluirFotoCasa(i) {

function desenharTabela(filtro) {

      return;

    h += '<div class="campo"><label for="tc' + k + '">' + esc(c.nome) + '</label>';

function otimista(i, st) {
  const c = E.chk, it = c.itens[i];
  it.status = st;
  const ap = c.itens.filter(function (x) { return x.status !== 'NA'; });
  c.total = ap.length;
  c.feitos = ap.filter(function (x) { return x.status === 'OK' || x.status === 'ATRASO'; }).length;
  c.pct = c.total ? Math.round(c.feitos * 100 / c.total) : 0;
  const y = window.scrollY; desenharChecklist(); window.scrollTo(0, y);
}
function marcarDoc(i, marcado) {
  const it = E.chk.itens[i];
  if (!marcado && it.auto && !it.data) aviso('Este item está marcado automaticamente pelo app (' + it.detalhe + ').');
  otimista(i, marcado ? 'OK' : 'PENDENTE');
  salvarDoc(i, marcado ? 'ENTREGUE' : '', null, null, true);
}
function naDoc(i) {
  const na = E.chk.itens[i].status === 'NA';
  otimista(i, na ? 'PENDENTE' : 'NA');
  salvarDoc(i, na ? '' : 'NÃO SE APLICA', null, null, true);
}
function detalheDoc(i) {
  const it = E.chk.itens[i];

  if (link === null) return;

  const st = it.status === 'OK' || it.status === 'ATRASO' ? 'ENTREGUE' : (it.status === 'NA' ? 'NÃO SE APLICA' : 'ENTREGUE');
  salvarDoc(i, st, link, obs);
}

/* ---------- FILA DE FOTOS (funciona sem internet) ----------
   As fotos ficam guardadas no celular (IndexedDB) e vão para o Drive quando houver internet. */
const FILA = { db: null, itens: [], enviando: false, feitos: 0, total: 0 };
function abrirBancoFila() {
  if (FILA.db) return Promise.resolve(FILA.db);
  return new Promise(function (ok, erro) {
    const req = indexedDB.open('sesmt_fila', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('fotos', { keyPath: 'chave' }); };
    req.onsuccess = function () { FILA.db = req.result; ok(FILA.db); };
    req.onerror = function () { erro(req.error); };
  });
}
function gravarFila(fn) {
  return abrirBancoFila().then(function (db) {
    return new Promise(function (ok, erro) {
      const tx = db.transaction('fotos', 'readwrite');
      fn(tx.objectStore('fotos'));
      tx.oncomplete = function () { ok(); };
      tx.onerror = function () { erro(tx.error || new Error('Não consegui guardar as fotos no celular.')); };
    });
  });
}
async function carregarFila() {
  try {
    const db = await abrirBancoFila();
    FILA.itens = await new Promise(function (ok, erro) {
      const q = db.transaction('fotos', 'readonly').objectStore('fotos').getAll();
      q.onsuccess = function () { ok(q.result || []); }; q.onerror = function () { erro(q.error); };
    });
    FILA.itens.sort(function (a, b) { return a.criado - b.criado; });
  } catch (e) { FILA.itens = []; }
  atualizarBarraFila();
}
async function guardarNaFila(itens) {
  await gravarFila(function (s) { itens.forEach(function (it) { s.put(it); }); });
  FILA.itens = FILA.itens.concat(itens);
  atualizarBarraFila();
}
async function tirarDaFila(chaves) {
  await gravarFila(function (s) { chaves.forEach(function (c) { s.delete(c); }); });
  FILA.itens = FILA.itens.filter(function (x) { return chaves.indexOf(x.chave) < 0; });
  atualizarBarraFila();
}
function destinoFila(it) { return it.tipo === 'veic' ? 'veic|' + it.mes + '|' + it.placa + '|' + it.secao : 'aloj|' + it.mes + '|' + it.casa; }
function naFila(destino) { return FILA.itens.filter(function (x) { return destinoFila(x) === destino; }); }
function novaChave() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9); }
function erroDeRede(e) {
  return !navigator.onLine || e instanceof TypeError || /Resposta inesperada|Failed to fetch|Load failed|NetworkError|sess[aã]o/i.test(String(e && e.message));
}

// Faixa com as miniaturas que ainda estão no celular (dentro da tela do veículo ou da casa)
function faixaFila(destino, id) {
  const its = naFila(destino);
  let h = '<div id="' + id + '" style="display:flex;flex-direction:column;gap:2px">';
  if (its.length) {
    const comErro = its.filter(function (x) { return x.erro; })[0];
    h += '<span class="sub">⏳ ' + its.length + ' foto(s) no celular aguardando envio</span>' +
      (comErro ? '<span class="sub" style="color:var(--vermelho, #c62828)">⚠ ' + esc(comErro.erro) + '</span>' : '') +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">';
    its.forEach(function (x) {
      h += '<div style="position:relative;width:76px">' +
        '<img src="' + x.mini + '" alt="Foto aguardando envio" style="width:76px;height:57px;object-fit:cover;border-radius:8px;opacity:.8;border:1px dashed var(--linha)">' +
        (x.erro ? '<span style="position:absolute;left:4px;top:2px">⚠</span>' : '') +
        '<button class="sec peq" aria-label="Tirar da fila" onclick="tirarFotoFila(\'' + x.chave + '\')" style="position:absolute;right:-6px;top:-8px;width:auto;min-height:0;padding:0 7px;line-height:22px">✕</button></div>';
    });
    h += '</div>';
  }
  return h + '</div>';
}
async function tirarFotoFila(chave) {
  if (!confirm('Tirar esta foto da fila? Ela não será enviada.')) return;
  try { await tirarDaFila([chave]); redesenharFotosAbertas(); } catch (e) { falha(e); }
}
function redesenharFotosAbertas() {
  if ($('filaV0') && E.veic && E.vi != null) return redesenharVeic();
  if ($('filaCasa') && E.casa) { const y = window.scrollY; guardarRascunhoCasa(); desenharCasa(); window.scrollTo(0, y); }
}

// Barra fixa acima do menu: quantas fotos faltam e botão "Enviar agora"
function atualizarBarraFila() {
  let b = $('filaBar');
  const n = FILA.itens.length, nErro = FILA.itens.filter(function (x) { return x.erro; }).length;
  if (!n) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('div'); b.id = 'filaBar'; b.setAttribute('role', 'status'); document.body.appendChild(b); }
  const nav = document.querySelector('nav');
  const baixo = (nav && !nav.classList.contains('escondido') ? nav.offsetHeight : 0) + 8;
  b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:' + baixo + 'px;z-index:6;width:min(520px, calc(100% - 24px));box-sizing:border-box;' +
    'background:var(--card);color:var(--texto);border:1px solid var(--linha);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.28);font-size:14px';
  const txt = FILA.enviando ? '⏫ Enviando fotos: ' + FILA.feitos + ' de ' + FILA.total + '…'
    : (navigator.onLine ? '⏳ ' : '📶 Sem internet · ') + n + ' foto(s) aguardando envio' + (nErro ? ' · ' + nErro + ' com erro' : '');
  b.innerHTML = '<span style="flex:1">' + txt + '</span>' + (FILA.enviando ? '' : '<button class="sec peq" style="width:auto" onclick="processarFila(true)">Enviar agora</button>');
}

async function processarFila(manual) {
  if (FILA.enviando || !token()) return;
  if (manual) {
    if (!navigator.onLine) return aviso('📶 Ainda sem internet. As fotos continuam guardadas no celular.');
    FILA.itens.forEach(function (x) { delete x.erro; });
  }
  let pend = FILA.itens.filter(function (x) { return !x.erro; });
  if (!pend.length) return atualizarBarraFila();
  FILA.enviando = true; FILA.feitos = 0; FILA.total = pend.length; atualizarBarraFila();
  let mudou = false, parou = false;
  try {
    while (true) {
      pend = FILA.itens.filter(function (x) { return !x.erro; });
      if (!pend.length) break;
      // Até 3 fotos seguidas do mesmo destino (e mesma legenda) por envio, mantendo a ordem
      const p = pend[0], grupo = [p];
      const mesmo = function (x) { return destinoFila(x) === destinoFila(p) && (x.legenda || '') === (p.legenda || ''); };
      for (let i = 1; i < pend.length && grupo.length < 3 && mesmo(pend[i]); i++) grupo.push(pend[i]);
      try {
        if (p.tipo === 'veic') {
          await run('apiUploadFotosLote', p.mes, p.placa, p.secao, grupo.map(function (x) { return { nome: x.nome, dataUrl: x.foto, chave: x.chave }; }));
          const v = E.veic && E.veic.mes === p.mes ? E.veic.veiculos.filter(function (y) { return y.placa === p.placa; })[0] : null;
          if (v) v.fotos[p.secao] = (v.fotos[p.secao] || 0) + grupo.length;
          if (E.vfotos) delete E.vfotos[p.mes + '|' + p.placa + '|' + p.secao];
          esquecer(['apiVeiculos', 'apiPainel']);
        } else {
          const res = await run('apiAlojUploadFotosLote', p.mes, p.casa, p.legenda, grupo.map(function (x) { return { dataUrl: x.foto, ordem: x.ordem, chave: x.chave }; }));
          if (E.casa && E.casa.casa.id === p.casa && E.aloj && E.aloj.mes === p.mes) {
            res.forEach(function (f, k) { E.casa.fotos.push({ id: f.id, legenda: f.legenda, thumb: grupo[k].mini }); });
          }
          esquecer(['apiAlojamentos', 'apiPainel']);
        }
        await tirarDaFila(grupo.map(function (x) { return x.chave; }));
        FILA.feitos += grupo.length; mudou = true;
        FILA.enviando = true; atualizarBarraFila();
      } catch (e) {
        if (erroDeRede(e)) { parou = true; break; }   // sem sinal: tenta de novo depois
        for (const x of grupo) { x.erro = e.message; try { await gravarFila(function (s) { s.put(x); }); } catch (er) { } }
        mudou = true;
      }
    }
  } finally { FILA.enviando = false; atualizarBarraFila(); }
  if (mudou) redesenharFotosAbertas();
  if (mudou && !parou && !FILA.itens.length) aviso('✔ Todas as fotos da fila foram enviadas para o Drive.');
}

window.addEventListener('online', function () { atualizarBarraFila(); setTimeout(function () { processarFila(); }, 1500); });
window.addEventListener('offline', atualizarBarraFila);
document.addEventListener('visibilitychange', function () { if (!document.hidden) processarFila(); });
setInterval(function () { if (FILA.itens.length && !FILA.enviando && navigator.onLine) processarFila(); }, 45000);
carregarFila().then(function () { processarFila(); });

// App abre mesmo sem internet (guarda a tela no celular)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });

if (token()) { verInicio(); setTimeout(preCarregar, 2500); } else telaLogin();
</script>
